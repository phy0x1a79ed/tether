[workspace]
resolver = "2"
members = ["crates/tether-proto"]

# Pinned in one place so the three binaries cannot disagree about the wire.
[workspace.dependencies]
tether-proto = { path = "crates/tether-proto" }

anyhow = "1"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
spake2 = "0.4"
subtle = "2"
thiserror = "2"

[profile.release]
# The owner downloads this over their own connection and runs it once, so size
# is a user-visible cost in a way it is not for a server binary.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
